name: Monthly Overage Audit

on:
  schedule:
    # 2nd of each month at 8:37 UTC. Staggered away from the top of the hour
    # because GitHub scheduled workflows can be delayed or dropped during load.
    # Invoices finalize on the 1st, so we audit the day after
    - cron: '37 8 2 * *'
  workflow_dispatch:  # Manual trigger for backfills

permissions:
  contents: write

jobs:
  overage-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run overage audit
        env:
          METRONOME_API_KEY: ${{ secrets.METRONOME_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python overage_audit.py

      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json

      - name: Record automation heartbeat
        if: always()
        continue-on-error: true
        run: |
          set +e

          mkdir -p .github/automation
          {
            echo "workflow=Monthly Overage Audit"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "updated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > .github/automation/monthly-overage-audit-last-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/automation/monthly-overage-audit-last-run.txt

          if git diff --cached --quiet; then
            echo "No heartbeat changes to commit."
            exit 0
          fi

          git commit -m "chore: record monthly overage audit heartbeat"
          git push
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not push heartbeat commit; monthly audit result is unaffected."
          fi

          exit 0

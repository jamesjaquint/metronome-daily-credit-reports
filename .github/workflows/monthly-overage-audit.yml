name: Monthly Overage Audit

on:
  schedule:
    # 2nd of each month at 7:00 UTC (2:00 AM EST / 1:00 AM CST)
    # Invoices finalize on the 1st, so we audit the day after
    - cron: '0 7 2 * *'
  workflow_dispatch:  # Manual trigger for backfills

jobs:
  overage-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run overage audit
        env:
          METRONOME_API_KEY: ${{ secrets.METRONOME_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python overage_audit.py

      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json

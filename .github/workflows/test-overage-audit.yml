name: Test Overage Audit

on:
  pull_request:
    paths:
      - 'overage_*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-overage-audit.yml'
  push:
    branches: [main]
    paths:
      - 'overage_*.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-overage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile overage_audit.py overage_calculations.py overage_publication.py

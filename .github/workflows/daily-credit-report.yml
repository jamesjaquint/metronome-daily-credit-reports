name: Daily Credit Report

on:
  schedule:
    # 11:00 UTC daily (6:00 AM EST / 5:00 AM CST)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run credit report
        env:
          METRONOME_API_KEY: ${{ secrets.METRONOME_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python credit_report.py

      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json

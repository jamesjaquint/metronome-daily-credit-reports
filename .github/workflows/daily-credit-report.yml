name: Daily Credit Report

on:
  schedule:
    # 7:17 UTC daily. Staggered away from the top of the hour because GitHub
    # scheduled workflows can be delayed or dropped during load.
    - cron: '17 7 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account file
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run credit report
        env:
          METRONOME_API_KEY: ${{ secrets.METRONOME_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python credit_report.py

      - name: Run Shahid analytics weekly report
        env:
          METRONOME_API_KEY: ${{ secrets.METRONOME_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python shahid_analytics_weekly.py

      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json
